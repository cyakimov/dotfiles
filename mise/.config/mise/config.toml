[tools]
# Language runtimes
node = "latest"
bun = "latest"
go = "1.25"
python = "3.11"
uv = "latest"
rust = "stable"
ruby = "latest"

# Core development and agent tooling
"npm:@fission-ai/openspec" = "latest"
just = "latest"
golangci-lint = "v2.12.0"
"npm:@earendil-works/pi-coding-agent" = "latest"
cmake = "latest"
gh = "latest"
git-lfs = "latest"
herdr = "latest"
lazygit = "latest"
mkcert = "latest"
neovim = "latest"
overmind = "latest"
"pipx:pre-commit" = "latest"
shellcheck = "latest"
trivy = "latest"

# Go, protobuf, and database tooling used by active projects
protobuf = "latest"
buf = "latest"
sqlc = "latest"
gomigrate = "latest"
"go:golang.org/x/tools/gopls" = "latest"
grpcurl = "latest"
protoc-gen-connect-go = "latest"
protoc-gen-go = "latest"
protoc-gen-go-grpc = "latest"

[settings]
env_file = ".env"
