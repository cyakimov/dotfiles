# Herdr terminal workspace manager.
# Keep its UI visually consistent with the Rose Pine Moon Ghostty theme.

[theme]
name = "rose-pine"

[terminal]
# New panes, tabs, and workspaces inherit their source context.
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
detach = "prefix+d"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
split_horizontal = "prefix+double_quote"
split_vertical = "prefix+percent"
new_tab = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto = "prefix+g"
copy_mode = "prefix+[" # Herdr's copy-mode entry key; copy-mode's internal keys are not configurable.

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

[advanced]
# Match Ghostty's 10 MB scrollback limit.
scrollback_limit_bytes = 10000000
