# Font configuration
font-family = Hack Nerd Font Mono
font-size = 15
font-thicken = true

# Orchard Breeze from Rex
window-colorspace = srgb
background = #f4f9ef
foreground = #3a4a35
selection-background = #d4ecc4
selection-foreground = #3a4a35
cursor-color = #5da24f
cursor-text = #f4f9ef
palette = 0=#3a4a35
palette = 1=#c65043
palette = 2=#4f9440
palette = 3=#a8831f
palette = 4=#4478b0
palette = 5=#90569c
palette = 6=#37897a
palette = 7=#d9e5cf
palette = 8=#75856b
palette = 9=#dd6455
palette = 10=#5fae4e
palette = 11=#c1992b
palette = 12=#558dc6
palette = 13=#a76bb3
palette = 14=#45a191
palette = 15=#fcfef9

# Copy/paste improvements
clipboard-trim-trailing-spaces = true
copy-on-select = true

# Scrollback limit (~10MB)
scrollback-limit = 10000000

# Shell integration
shell-integration = detect
shell-integration-features = no-cursor

# Window settings
window-inherit-working-directory = true
window-inherit-font-size = true
window-padding-x = 8
window-padding-y = 6
window-padding-balance = true
window-save-state = always
macos-titlebar-style = hidden

# Cursor
cursor-style = block
cursor-style-blink = true

# Mouse behavior
mouse-hide-while-typing = true

# Background
background-opacity = 0.8
background-blur = 50

# Splits
unfocused-split-opacity = 0.62

macos-option-as-alt = left
