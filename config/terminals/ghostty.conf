# Font configuration
font-family = JetBrainsMono Nerd Font Mono
font-style = SemiBold
font-size = 14

# Orchard Breeze with text colors adjusted for a translucent light background.
window-colorspace = srgb
minimum-contrast = 4.5
background = #f4f9ef
foreground = #3a4a35
selection-background = #d4ecc4
selection-foreground = #3a4a35
cursor-color = #477b3c
cursor-text = #f4f9ef
palette = 0=#3a4a35
palette = 1=#763028
palette = 2=#2a4e22
palette = 3=#574310
palette = 4=#294869
palette = 5=#5d3865
palette = 6=#1f4d45
palette = 7=#444741
palette = 8=#4b5645
palette = 9=#863c33
palette = 10=#325c29
palette = 11=#655017
palette = 12=#345578
palette = 13=#6b4473
palette = 14=#275b52
palette = 15=#525351

# Copy/paste improvements
clipboard-trim-trailing-spaces = true
copy-on-select = true

# Scrollback limit (~10MB)
scrollback-limit = 10000000

# Shell integration
shell-integration = detect
shell-integration-features = no-cursor

# Window settings
window-inherit-working-directory = true
window-inherit-font-size = true
window-padding-x = 8
window-padding-y = 6
window-padding-balance = true
window-save-state = always
macos-titlebar-style = hidden

# Cursor
cursor-style = block
cursor-style-blink = true

# Mouse behavior
mouse-hide-while-typing = true

# Background
background-opacity = 0.8
background-blur = 50

# Splits
unfocused-split-opacity = 0.62

macos-option-as-alt = left
