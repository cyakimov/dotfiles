# Versioned tmux configuration.
# Keep stock tmux keybindings and add only focused quality-of-life defaults.

# Core behavior
set -g default-terminal "tmux-256color"
set -gu terminal-features
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:hyperlinks"
set -g focus-events on
set -g history-limit 100000
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# Restore tmux's stock prefix+r refresh binding, including for servers migrated
# from the previous local configuration. Use uppercase R for reload.
bind-key r refresh-client
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind C-l send-keys 'C-l'

# Vi-style copy mode with system clipboard support where available.
setw -g mode-keys vi
set -g copy-command 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Rose Pine Moon minimal status bar.
set -g status-interval 5
set -g status-style "bg=#232136,fg=#908caa"
set -g status-left "#[fg=#c4a7e7,bold] #S "
set -g status-left-length 40
set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g window-status-current-format "#[fg=#232136,bg=#c4a7e7,bold] #I:#W "
set -g window-status-activity-style "fg=#f6c177"
set -g window-status-bell-style "fg=#eb6f92"
set -g status-right "#[fg=#908caa] %H:%M "
